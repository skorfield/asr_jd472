[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skorfield-asr_jd472"
version = "0.1.0"
description = "解析时间标记，排列语音识别算法工程师·冷启动与模型加载时间的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "skorfield" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://skorfield.github.io"
Repository = "https://github.com/skorfield/asr_jd472"
Issues = "https://github.com/skorfield/asr_jd472/issues"

[project.scripts]
asr_jd472 = "asr_jd472:main"

[tool.setuptools]
py-modules = ["asr_jd472"]
